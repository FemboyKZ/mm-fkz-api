name: Build

on:
  push:
    branches: ["*"]
    tags: ["*"]
    paths-ignore:
      - "configs/**"
      - "README.md"
  pull_request:
    branches: ["*"]
    paths-ignore:
      - "configs/**"
      - "README.md"

jobs:
  build-linux:
    name: ${{ matrix.name }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SteamRT3
            runtime: steamrt3
          - name: SteamRT4
            runtime: steamrt4
    container:
      image: ghcr.io/femboykz/build-containers:${{ matrix.runtime }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Init submodules
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf s2sdk
          git init -q s2sdk
          git -C s2sdk remote add origin "$(git config -f .gitmodules submodule.s2sdk.url)"
          git -C s2sdk fetch -q --depth 1 origin "$(git rev-parse HEAD:s2sdk)"
          git -C s2sdk checkout -q FETCH_HEAD
          git submodule update --init --depth 1 --jobs 4
          git -C metamod-source submodule update --init --depth 1 hl2sdk-manifests third_party/khook

      - name: Configure
        run: |
          mkdir -p build && cd build
          python3 ../configure.py \
            --enable-optimize \
            --symbol-files

      - name: Build
        working-directory: build
        run: ambuild

      - name: Stage package
        run: |
          mkdir -p staging
          cp -r build/package/* staging/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fkz-api-${{ matrix.runtime }}
          path: staging

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: fkz-api-${{ matrix.runtime }}-symbols
          path: build/fkz-api.cs2/linux-x86_64/*.dbg

  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Init submodules
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf s2sdk
          git init -q s2sdk
          git -C s2sdk remote add origin "$(git config -f .gitmodules submodule.s2sdk.url)"
          git -C s2sdk fetch -q --depth 1 origin "$(git rev-parse HEAD:s2sdk)"
          git -C s2sdk checkout -q FETCH_HEAD
          git submodule update --init --depth 1 --jobs 4
          git -C metamod-source submodule update --init --depth 1 hl2sdk-manifests third_party/khook

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install AMBuild
        run: |
          git clone https://github.com/alliedmodders/ambuild.git
          pip install ./ambuild

      - name: Configure
        run: |
          mkdir -Force build | Out-Null; cd build
          python ../configure.py `
            --enable-optimize

      - name: Build
        working-directory: build
        env:
          LINK: /MAP
        run: ambuild

      - name: Stage package
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item -Recurse build/package/* staging/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: fkz-api-windows
          path: staging

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: fkz-api-windows-symbols
          path: |
            build/fkz-api.cs2/windows-x86_64/*.pdb
            build/fkz-api.cs2/windows-x86_64/*.map

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows]
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Download SteamRT3 artifact
        uses: actions/download-artifact@v8
        with:
          name: fkz-api-steamrt3
          path: fkz-api-steamrt3

      - name: Download SteamRT4 artifact
        uses: actions/download-artifact@v8
        with:
          name: fkz-api-steamrt4
          path: fkz-api-steamrt4

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: fkz-api-windows
          path: fkz-api-windows

      - name: Download symbol artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: fkz-api-*-symbols
          path: symbols

      - name: Create archives
        run: |
          cd fkz-api-steamrt3 && zip -r ../fkz-api-${{ github.ref_name }}-steamrt3.zip . && cd ..
          cd fkz-api-steamrt4 && zip -r ../fkz-api-${{ github.ref_name }}-steamrt4.zip . && cd ..
          cd fkz-api-windows && zip -r ../fkz-api-${{ github.ref_name }}-windows.zip . && cd ..
          cd symbols && zip -r ../fkz-api-${{ github.ref_name }}-symbols.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            fkz-api-${{ github.ref_name }}-steamrt3.zip
            fkz-api-${{ github.ref_name }}-steamrt4.zip
            fkz-api-${{ github.ref_name }}-windows.zip
            fkz-api-${{ github.ref_name }}-symbols.zip
          generate_release_notes: true
