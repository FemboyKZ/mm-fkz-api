name: Build

on:
  push:
    branches: ["*"]
    tags: ["*"]
    paths-ignore:
      - "configs/**"
      - "README.md"
  pull_request:
    branches: ["*"]
    paths-ignore:
      - "configs/**"
      - "README.md"

jobs:
  build-linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SteamRT3
            runtime: steamrt3
          - name: SteamRT4
            runtime: steamrt4
    container:
      image: ghcr.io/femboykz/build-containers:${{ matrix.runtime }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Init submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init -q hl2sdk-cs2
          git -C hl2sdk-cs2 fetch -q --depth 1 "$(git config -f .gitmodules submodule.hl2sdk-cs2.url)" "$(git rev-parse HEAD:hl2sdk-cs2)"
          git -C hl2sdk-cs2 checkout -q FETCH_HEAD
          git submodule update --init --depth 1 --jobs 4
          git -C metamod-source submodule update --init --depth 1 hl2sdk-manifests third_party/khook

      - name: Configure
        run: |
          mkdir -p build && cd build
          python3 ../configure.py \
            --enable-optimize \
            --symbol-files

      - name: Build
        working-directory: build
        run: ambuild

      - name: Stage package
        run: |
          mkdir -p staging/addons
          cp -r build/package/addons/* staging/addons/
          mkdir -p staging/cfg/fkz-api
          cp configs/*.cfg staging/cfg/fkz-api/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mm-fkz-api-${{ matrix.runtime }}
          path: staging

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: mm-fkz-api-${{ matrix.runtime }}-symbols
          path: build/fkz-api.cs2/linux-x86_64/*.dbg

  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Init submodules
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init -q hl2sdk-cs2
          git -C hl2sdk-cs2 fetch -q --depth 1 "$(git config -f .gitmodules submodule.hl2sdk-cs2.url)" "$(git rev-parse HEAD:hl2sdk-cs2)"
          git -C hl2sdk-cs2 checkout -q FETCH_HEAD
          git submodule update --init --depth 1 --jobs 4
          git -C metamod-source submodule update --init --depth 1 hl2sdk-manifests third_party/khook

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install AMBuild
        run: |
          git clone https://github.com/alliedmodders/ambuild.git
          pip install ./ambuild

      - name: Configure
        run: |
          mkdir -Force build | Out-Null; cd build
          python ../configure.py `
            --enable-optimize

      - name: Build
        working-directory: build
        env:
          LINK: /MAP
        run: ambuild

      - name: Stage package
        run: |
          New-Item -ItemType Directory -Force -Path staging/addons | Out-Null
          Copy-Item -Recurse build/package/addons/* staging/addons/
          New-Item -ItemType Directory -Force -Path staging/cfg/fkz-api | Out-Null
          Copy-Item configs/*.cfg staging/cfg/fkz-api/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mm-fkz-api-windows
          path: staging

      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: mm-fkz-api-windows-symbols
          path: |
            build/fkz-api.cs2/windows-x86_64/*.pdb
            build/fkz-api.cs2/windows-x86_64/*.map

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download SteamRT3 artifact
        uses: actions/download-artifact@v8
        with:
          name: mm-fkz-api-steamrt3
          path: mm-fkz-api-steamrt3

      - name: Download SteamRT4 artifact
        uses: actions/download-artifact@v8
        with:
          name: mm-fkz-api-steamrt4
          path: mm-fkz-api-steamrt4

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: mm-fkz-api-windows
          path: mm-fkz-api-windows

      - name: Download symbol artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mm-fkz-api-*-symbols
          path: symbols

      - name: Create archives
        run: |
          cd mm-fkz-api-steamrt3 && zip -r ../mm-fkz-api-${{ github.ref_name }}-steamrt3.zip . && cd ..
          cd mm-fkz-api-steamrt4 && zip -r ../mm-fkz-api-${{ github.ref_name }}-steamrt4.zip . && cd ..
          cd mm-fkz-api-windows && zip -r ../mm-fkz-api-${{ github.ref_name }}-windows.zip . && cd ..
          cd symbols && zip -r ../mm-fkz-api-${{ github.ref_name }}-symbols.zip . && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            mm-fkz-api-${{ github.ref_name }}-steamrt3.zip
            mm-fkz-api-${{ github.ref_name }}-steamrt4.zip
            mm-fkz-api-${{ github.ref_name }}-windows.zip
            mm-fkz-api-${{ github.ref_name }}-symbols.zip
          generate_release_notes: true
